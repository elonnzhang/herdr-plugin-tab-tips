id = "local.herdr-plugin-tab-tips"
name = "Herdr Tab Tips"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Shows pane labels, the active pane in the tab bar, and copies the active pane ID."
platforms = ["linux", "macos"]

[[actions]]
id = "copy-pane-id"
title = "Copy active pane ID"
contexts = ["global", "pane"]
command = ["python3", "plugin.py", "copy-id"]

[[events]]
on = "pane.created"
command = ["python3", "plugin.py", "pane-created"]

[[events]]
on = "pane.focused"
command = ["python3", "plugin.py", "pane-focused"]
